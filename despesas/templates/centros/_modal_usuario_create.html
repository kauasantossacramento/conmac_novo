<!-- templates/centros/_modal_usuario_create.html -->
<div class="modal__head">
  <strong>Novo usuário</strong>
  <button type="button" class="close" data-close-modal>×</button>
</div>
<div class="modal__content">
  <form method="post" class="js-user-create">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <p>{{ form.username.label_tag }} {{ form.username }}</p>
    <p>{{ form.password1.label_tag }} {{ form.password1 }}</p>
    <p>{{ form.password2.label_tag }} {{ form.password2 }}</p>
    <div class="modal__footer">
      <button type="button" class="btn-outline" data-close-modal>fechar</button>
      <button type="submit" class="btn">criar</button>
    </div>
  </form>
</div>
<script>
(function(){
  const f = document.querySelector('.js-user-create');
  if(!f) return;
  f.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(f);
    const r = await fetch("{% url 'usuario_create_modal' %}", {method:'POST', body: fd, headers:{'X-Requested-With':'XMLHttpRequest'}});
    if(r.ok){
      const data = await r.json().catch(()=>null);
      if(data && data.ok){
        const root = document.getElementById('modal-root');
        root.hidden = true; root.innerHTML = '';
        location.reload(); // se quiser, pode só atualizar a lista de associados via ajax
        return;
      }
      const html = await r.text();
      document.querySelector('.modal__body').innerHTML = html;
    }
  });
})();
</script>
